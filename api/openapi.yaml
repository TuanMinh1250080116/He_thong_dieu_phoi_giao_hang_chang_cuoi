components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token

  headers:
    ETag:
      description: Current version of the resource. Send it back as If-Match on the next command.
      schema:
        type: string
    CorrelationId:
      description: Request correlation ID, also present in logs, audit and events.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    IdempotentReplayed:
      description: "`true` when the stored result of an earlier identical request is returned."
      schema:
        type: string
        enum: ['true']

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 8 to 128 printable characters, a UUID is recommended. Reuse it only to retry the same request, within 24 hours.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Version received in the last ETag, for example `"3"`. Missing gives 428, outdated gives 409 VERSION_CONFLICT.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `nextCursor`. Only valid with the same filters.
      schema:
        type: string
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StopId:
      name: stopId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: VALIDATION_ERROR. `errors` lists the failing fields.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: AUTHENTICATION_REQUIRED or AUTHENTICATION_FAILED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: FORBIDDEN or ACCOUNT_DISABLED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: RESOURCE_NOT_FOUND. Also returned when the resource exists but is outside the caller's scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: A business conflict. Tell them apart by `code`, not by status.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: The request is well formed but breaks a business rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: PRECONDITION_REQUIRED. The If-Match header is missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Locked:
      description: ACCOUNT_LOCKED after too many wrong passwords
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: RATE_LIMITED
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: EXTERNAL_DEPENDENCY_UNAVAILABLE. Retry with the same Idempotency-Key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - AUTHENTICATION_REQUIRED
        - AUTHENTICATION_FAILED
        - ACCOUNT_LOCKED
        - ACCOUNT_DISABLED
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - PRECONDITION_REQUIRED
        - VERSION_CONFLICT
        - STATE_TRANSITION_NOT_ALLOWED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
        - ORDER_ALREADY_IN_ACTIVE_BATCH
        - ASSIGNMENT_CONFLICT
        - DRIVER_INELIGIBLE
        - RECOMMENDATION_EXPIRED
        - RECOMMENDATION_INVALIDATED
        - ZONE_UNRESOLVED
        - BATCH_LOCK_VALIDATION_FAILED
        - COMPLETION_PREREQUISITES_MISSING
        - POD_POLICY_NOT_SATISFIED
        - OTP_INVALID_OR_EXPIRED
        - OTP_LOCKED
        - EVIDENCE_INVALID
        - UPLOAD_FAILED
        - RATE_LIMITED
        - EXTERNAL_DEPENDENCY_UNAVAILABLE
        - UNEXPECTED_FAILURE

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: JSON path of the request field, or the header name
        code:
          type: string
        message:
          type: string

    Problem:
      type: object
      required: [type, title, status, code, correlationId, retryable]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        correlationId:
          type: string
        retryable:
          type: boolean
        currentVersion:
          type: integer
          format: int64
          description: Only on VERSION_CONFLICT
        errors:
          type: array
          description: Only on VALIDATION_ERROR
          items:
            $ref: '#/components/schemas/FieldError'
        details:
          type: object
          additionalProperties: true
          description: Safe details for the caller's scope

    Capability:
      type: string
      enum:
        - canEditOrder
        - canCancelOrder
        - canLockBatch
        - canReopenBatch
        - canGenerateRecommendation
        - canAssign
        - canOverrideRecommendation
        - canReassign
        - canCancelDispatch
        - canAcceptAssignment
        - canRejectAssignment
        - canStartDelivery
        - canSubmitPod
        - canCompleteDelivery
        - canResumeStop
        - canInvestigateException
        - canResolveException
        - canCancelException

    Capabilities:
      type: array
      description: Actions allowed right now. For rendering only; the server checks again.
      items:
        $ref: '#/components/schemas/Capability'

    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180

    TimeWindow:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email
        password:
          type: string
          format: password

    UserSummary:
      type: object
      required: [id, email, displayName, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [CUSTOMER, DISPATCHER, DRIVER, OPS_MANAGER, SYSTEM_ADMIN]

    AuthResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: Seconds until the access token expires
        user:
          $ref: '#/components/schemas/UserSummary'

    MeResponse:
      type: object
      required: [id, email, displayName, roles, permissions, scopeZoneIds]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
          description: Codes such as dispatch.assign
        scopeZoneIds:
          type: array
          items:
            type: string
            format: uuid

    OrderStatus:
      type: string
      enum: [DRAFT, READY_FOR_DISPATCH, BATCHED, ASSIGNED, IN_DELIVERY, DELIVERED, CANCELLED]

    AddressInput:
      type: object
      required: [address]
      properties:
        address:
          type: string
        point:
          $ref: '#/components/schemas/GeoPoint'

    PackageInput:
      type: object
      required: [weightG]
      properties:
        weightG:
          type: integer
          minimum: 1
        lengthCm:
          type: integer
          minimum: 1
        widthCm:
          type: integer
          minimum: 1
        heightCm:
          type: integer
          minimum: 1
        note:
          type: string

    CreateOrderRequest:
      type: object
      required: [saveMode, pickup, dropoff, recipient, package, timeWindow]
      properties:
        saveMode:
          type: string
          enum: [DRAFT, SUBMIT]
        pickup:
          $ref: '#/components/schemas/AddressInput'
        dropoff:
          $ref: '#/components/schemas/AddressInput'
        recipient:
          type: object
          required: [name]
          properties:
            name:
              type: string
            contact:
              type: string
        package:
          $ref: '#/components/schemas/PackageInput'
        timeWindow:
          $ref: '#/components/schemas/TimeWindow'

    UpdateOrderRequest:
      type: object
      required: [pickup, dropoff, recipient, package, timeWindow]
      properties:
        pickup:
          $ref: '#/components/schemas/AddressInput'
        dropoff:
          $ref: '#/components/schemas/AddressInput'
        recipient:
          type: object
          required: [name]
          properties:
            name:
              type: string
            contact:
              type: string
        package:
          $ref: '#/components/schemas/PackageInput'
        timeWindow:
          $ref: '#/components/schemas/TimeWindow'

    CancelOrderRequest:
      type: object
      properties:
        reason:
          type: string
          description: Required unless the order is still a draft

    OrderTracking:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [milestone, occurredAt]
            properties:
              milestone:
                type: string
                enum: [ORDER_RECEIVED, BATCHED, DRIVER_ASSIGNED, REASSIGNING, OUT_FOR_DELIVERY, DELIVERY_ISSUE, DELIVERED, ORDER_CANCELLED]
              occurredAt:
                type: string
                format: date-time
              note:
                type: string
                nullable: true

    OrderDetail:
      type: object
      required: [id, code, status, pickup, dropoff, recipient, package, timeWindow, version]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        pickup:
          $ref: '#/components/schemas/AddressInput'
        dropoff:
          $ref: '#/components/schemas/AddressInput'
        recipient:
          type: object
          properties:
            name:
              type: string
            contact:
              type: string
              description: Partly masked unless the caller may see it
        package:
          $ref: '#/components/schemas/PackageInput'
        timeWindow:
          $ref: '#/components/schemas/TimeWindow'
        zoneId:
          type: string
          format: uuid
          nullable: true
          description: Set by the server, never sent by the client
        version:
          type: integer
          format: int64
        cancelReason:
          type: string
          nullable: true
        capabilities:
          $ref: '#/components/schemas/Capabilities'

    OrderEnvelope:
      type: object
      required: [data, version, capabilities]
      properties:
        data:
          $ref: '#/components/schemas/OrderDetail'
        version:
          type: integer
          format: int64
        capabilities:
          $ref: '#/components/schemas/Capabilities'

    OrderPage:
      type: object
      required: [items, nextCursor, asOf]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderDetail'
        nextCursor:
          type: string
          nullable: true
        asOf:
          type: string
          format: date-time

    CreateBatchRequest:
      type: object
      required: [zoneId, orderIds]
      properties:
        zoneId:
          type: string
          format: uuid
        orderIds:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid

    BatchStatus:
      type: string
      enum: [DRAFT, LOCKED, COMPLETED, CANCELLED]

    BatchDetail:
      type: object
      required: [id, code, zoneId, status, orderCount, totalWeightG, totalVolumeCm3, version]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        zoneId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/BatchStatus'
        orderCount:
          type: integer
          minimum: 0
          maximum: 50
        totalWeightG:
          type: integer
          format: int64
        totalVolumeCm3:
          type: integer
          format: int64
        plannedWindow:
          type: object
          nullable: true
          required: [start, end]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        orderIds:
          type: array
          items:
            type: string
            format: uuid
        decisionId:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
          format: int64
        capabilities:
          $ref: '#/components/schemas/Capabilities'

    BatchEnvelope:
      type: object
      required: [data, version, capabilities]
      properties:
        data:
          $ref: '#/components/schemas/BatchDetail'
        version:
          type: integer
          format: int64
        capabilities:
          $ref: '#/components/schemas/Capabilities'

    CandidateBreakdown:
      type: object
      required: [distance, capacityFit, availability, zoneCompatibility]
      properties:
        distance:
          type: number
          minimum: 0
          maximum: 100
        capacityFit:
          type: number
          minimum: 0
          maximum: 100
        availability:
          type: number
          minimum: 0
          maximum: 100
        zoneCompatibility:
          type: number
          minimum: 0
          maximum: 100

    RecommendationCandidate:
      type: object
      required: [rank, driverId, totalScore, distanceM, distanceBasis, breakdown]
      properties:
        rank:
          type: integer
          minimum: 1
        driverId:
          type: string
          format: uuid
        driverName:
          type: string
        vehicle:
          type: object
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
        totalScore:
          type: number
        distanceM:
          type: number
        distanceBasis:
          type: string
          enum: [GEODESIC]
          description: Straight-line distance, not driving distance
        breakdown:
          $ref: '#/components/schemas/CandidateBreakdown'

    RecommendationSnapshot:
      type: object
      required: [id, status, effectiveStatus, generatedAt, expiresAt, ruleVersion, candidateCount, eligibleCount, outcome, candidates]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, CONSUMED, EXPIRED, INVALIDATED]
        effectiveStatus:
          type: string
          enum: [ACTIVE, CONSUMED, EXPIRED, INVALIDATED]
          description: Computed by the server. The client must not derive it from its own clock.
        generatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        ruleVersion:
          type: object
          required: [id, versionNo]
          properties:
            id:
              type: string
              format: uuid
            versionNo:
              type: integer
        candidateCount:
          type: integer
          minimum: 0
        eligibleCount:
          type: integer
          minimum: 0
        exclusionSummary:
          type: object
          additionalProperties:
            type: integer
          description: Number of drivers excluded per reason code
        outcome:
          type: string
          enum: [RANKED, NO_ELIGIBLE_DRIVER]
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationCandidate'

    RecommendationEnvelope:
      type: object
      required: [data, version, capabilities]
      properties:
        data:
          type: object
          required: [decisionId, snapshot]
          properties:
            decisionId:
              type: string
              format: uuid
            snapshot:
              $ref: '#/components/schemas/RecommendationSnapshot'
        version:
          type: integer
          format: int64
        capabilities:
          $ref: '#/components/schemas/Capabilities'

    AssignRequest:
      type: object
      required: [snapshotId]
      properties:
        snapshotId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
          description: Omit for the top recommendation. Any other eligible driver is an override and needs overrideReason.
        overrideReason:
          type: string

    DecisionEnvelope:
      type: object
      required: [data, version]
      properties:
        data:
          type: object
          properties:
            decisionId:
              type: string
              format: uuid
            status:
              type: string
              enum: [PENDING_DECISION, AWAITING_DRIVER_RESPONSE, CONFIRMED, AWAITING_REASSIGNMENT, CANCELLED]
            assignment:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
                status:
                  $ref: '#/components/schemas/AssignmentStatus'
                kind:
                  type: string
                driverId:
                  type: string
                  format: uuid
                driverName:
                  type: string
                rejectionReasonCode:
                  type: string
                  nullable: true
        version:
          type: integer
          format: int64
        capabilities:
          $ref: '#/components/schemas/Capabilities'

    ReassignRequest:
      type: object
      required: [driverId, reason]
      properties:
        driverId:
          type: string
          format: uuid
        reason:
          type: string

    CancelDispatchRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    RejectAssignmentRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
        description:
          type: string
          description: Required when the chosen reason has requiresDescription = true (OTHER)

    RejectionReason:
      type: object
      required: [code, requiresDescription]
      properties:
        code:
          type: string
        requiresDescription:
          type: boolean

    RejectionReasonList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RejectionReason'

    DispatchCancelledEnvelope:
      type: object
      required: [data, version]
      properties:
        data:
          type: object
          properties:
            decisionId:
              type: string
              format: uuid
            status:
              type: string
              enum: [CANCELLED]
        version:
          type: integer
          format: int64
        capabilities:
          $ref: '#/components/schemas/Capabilities'

    AssignmentStatus:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, CANCELLED, SUPERSEDED]

    AssignmentDetail:
      type: object
      required: [id, decisionId, deliveryId, driverId, status, kind]
      properties:
        id:
          type: string
          format: uuid
        decisionId:
          type: string
          format: uuid
        deliveryId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AssignmentStatus'
        kind:
          type: string
          enum: [ACCEPT_RECOMMENDATION, OVERRIDE, REASSIGN]
        version:
          type: integer
          format: int64
          description: Version of the dispatch decision; send it as If-Match when accepting

    AssignmentEnvelope:
      type: object
      required: [data, version, capabilities]
      properties:
        data:
          $ref: '#/components/schemas/AssignmentDetail'
        version:
          type: integer
          format: int64
        capabilities:
          $ref: '#/components/schemas/Capabilities'

    AssignmentPage:
      type: object
      required: [items, nextCursor, asOf]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentDetail'
        nextCursor:
          type: string
          nullable: true
        asOf:
          type: string
          format: date-time

    DeliveryStatus:
      type: string
      enum: [ASSIGNED, ACCEPTED, AWAITING_REASSIGNMENT, IN_PROGRESS, COMPLETED, CANCELLED]

    StopStatus:
      type: string
      enum: [PENDING, IN_PROGRESS, COMPLETED, BLOCKED, SKIPPED]

    DeliveryStop:
      type: object
      required: [id, orderId, sequence, status]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/StopStatus'
        address:
          type: string
        arrivedAt:
          type: string
          format: date-time
          nullable: true
        podRequired:
          type: array
          items:
            type: string
            enum: [OTP, PHOTO, SIGNATURE]
        podSubmitted:
          type: boolean

    BlockedBy:
      type: object
      required: [capability, reason]
      properties:
        capability:
          $ref: '#/components/schemas/Capability'
        reason:
          type: string
        refs:
          type: array
          items:
            type: string

    DeliveryDetail:
      type: object
      required: [id, batchId, status, stops, version]
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        driverId:
          type: string
          format: uuid
        stops:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryStop'
        completedStops:
          type: integer
          minimum: 0
        version:
          type: integer
          format: int64
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        blockedBy:
          type: array
          items:
            $ref: '#/components/schemas/BlockedBy'

    DeliveryEnvelope:
      type: object
      required: [data, version, capabilities]
      properties:
        data:
          $ref: '#/components/schemas/DeliveryDetail'
        version:
          type: integer
          format: int64
        capabilities:
          $ref: '#/components/schemas/Capabilities'

    StopActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [START_STOP, MARK_ARRIVED, MARK_READY_FOR_POD, RESUME_AFTER_EXCEPTION, REQUEST_SKIP]

    EvidenceUploadRequest:
      type: object
      required: [purpose, kind, mimeType, sizeBytes]
      properties:
        purpose:
          type: string
          enum: [POD, EXCEPTION]
        kind:
          type: string
          enum: [PHOTO, SIGNATURE]
        stopId:
          type: string
          format: uuid
        mimeType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1

    EvidenceUploadResponse:
      type: object
      required: [evidenceId, uploadUrl, method, expiresAt]
      properties:
        evidenceId:
          type: string
          format: uuid
        uploadUrl:
          type: string
        method:
          type: string
          enum: [PUT]
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time

    EvidenceCompleteRequest:
      type: object
      required: [sha256]
      properties:
        sha256:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'

    EvidenceStatus:
      type: object
      required: [evidenceId, status]
      properties:
        evidenceId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, VERIFIED, QUARANTINED, ATTACHED]

    SubmitPodRequest:
      type: object
      required: [gps]
      properties:
        gps:
          type: object
          required: [point, accuracyM]
          properties:
            point:
              $ref: '#/components/schemas/GeoPoint'
            accuracyM:
              type: number
              minimum: 0
        isDirectHandoff:
          type: boolean
        recipientName:
          type: string
        evidenceIds:
          type: array
          items:
            type: string
            format: uuid
        otpChallengeId:
          type: string
          format: uuid
        note:
          type: string

    PodSummary:
      type: object
      required: [id, stopId, capturedAt, gpsConfirmed, evidenceTypes, otpStatus]
      properties:
        id:
          type: string
          format: uuid
        stopId:
          type: string
          format: uuid
        capturedAt:
          type: string
          format: date-time
          description: Set by the server
        recipientName:
          type: string
        gpsConfirmed:
          type: boolean
        evidenceTypes:
          type: array
          items:
            type: string
            enum: [OTP, PHOTO, SIGNATURE]
        otpStatus:
          type: string
          enum: [VERIFIED, NOT_VERIFIED]
        evidence:
          type: array
          description: Attached evidence; ask for a short-lived link with the access endpoint
          items:
            type: object
            required: [id, kind]
            properties:
              id:
                type: string
                format: uuid
              kind:
                type: string
                enum: [PHOTO, SIGNATURE]

    ExceptionStatus:
      type: string
      enum: [OPEN, INVESTIGATING, RESOLVED, CANCELLED]

    ExceptionImpact:
      type: string
      enum: [NON_BLOCKING, BLOCKS_STOP, BLOCKS_DELIVERY_COMPLETION, CUSTOMER_IMPACTING]

    UserRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    ReportExceptionRequest:
      type: object
      required: [type, description]
      properties:
        type:
          type: string
        description:
          type: string
        stopId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
          description: Only an operations manager may change the type default
        evidenceIds:
          type: array
          items:
            type: string
            format: uuid
          description: Verified evidence uploaded with purpose EXCEPTION

    InvestigateExceptionRequest:
      type: object
      required: [assigneeId, note]
      properties:
        assigneeId:
          type: string
          format: uuid
        note:
          type: string

    ResolveExceptionRequest:
      type: object
      required: [outcome, note]
      properties:
        outcome:
          type: string
          enum: [RESUME_DELIVERY, REATTEMPT_LATER, RETURN_TO_SENDER, NO_ACTION_NEEDED]
        note:
          type: string

    CancelExceptionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    ExceptionNoteRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string

    ExceptionNote:
      type: object
      required: [id, type, body, author, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [CONTEXT, INVESTIGATION, RESOLUTION]
        body:
          type: string
        author:
          $ref: '#/components/schemas/UserRef'
        createdAt:
          type: string
          format: date-time

    ExceptionSummary:
      type: object
      required: [id, code, deliveryId, deliveryCode, type, severity, impact, blocking, status, description, reporter, reportedAt, version]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        deliveryId:
          type: string
          format: uuid
        deliveryCode:
          type: string
        stopId:
          type: string
          format: uuid
          nullable: true
        stopStatus:
          type: string
          nullable: true
        orderId:
          type: string
          format: uuid
          nullable: true
        type:
          type: object
          required: [code, name]
          properties:
            code:
              type: string
            name:
              type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        impact:
          $ref: '#/components/schemas/ExceptionImpact'
        blocking:
          type: boolean
        status:
          $ref: '#/components/schemas/ExceptionStatus'
        description:
          type: string
        reporter:
          $ref: '#/components/schemas/UserRef'
        assignee:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        reportedAt:
          type: string
          format: date-time
        investigatingAt:
          type: string
          format: date-time
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        resolutionOutcome:
          type: string
          nullable: true
        resolutionNote:
          type: string
          nullable: true
        cancellationReason:
          type: string
          nullable: true
        version:
          type: integer
          format: int64

    ExceptionDetail:
      allOf:
        - $ref: '#/components/schemas/ExceptionSummary'
        - type: object
          properties:
            notes:
              type: array
              items:
                $ref: '#/components/schemas/ExceptionNote'
            evidenceIds:
              type: array
              items:
                type: string
                format: uuid

    ExceptionEnvelope:
      type: object
      required: [data, version]
      properties:
        data:
          $ref: '#/components/schemas/ExceptionDetail'
        version:
          type: integer
          format: int64
        capabilities:
          $ref: '#/components/schemas/Capabilities'

    ExceptionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExceptionSummary'
        nextCursor:
          type: string
          nullable: true
        asOf:
          type: string
          format: date-time

    ExceptionTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [code, name, defaultSeverity, impact]
            properties:
              code:
                type: string
              name:
                type: string
              defaultSeverity:
                type: string
                enum: [LOW, MEDIUM, HIGH, CRITICAL]
              impact:
                $ref: '#/components/schemas/ExceptionImpact'

    AuditRecord:
      type: object
      required: [id, occurredAt, actor, action, entityType, entityId, correlationId]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actor:
          type: object
          required: [type]
          properties:
            id:
