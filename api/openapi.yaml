openapi: 3.0.3
info:
  title: Last-mile Delivery Dispatch API
  version: 1.0.0
  description: REST API của hệ thống điều phối giao hàng chặng cuối.
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: Sign in, refresh, sign out and the current user
  - name: Orders
    description: Customer orders and their lifecycle
  - name: Dispatch
    description: Batching, recommendation and driver assignment
  - name: Delivery
    description: Driver assignments and delivery execution
  - name: Proof
    description: Proof of delivery and evidence upload
  - name: Notifications
    description: In-app notifications
security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in and receive an access token plus a refresh cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in. The refresh token is set as an HttpOnly cookie.
          headers:
            Set-Cookie:
              description: refresh_token cookie (HttpOnly, SameSite=Strict, path /api/v1/auth)
              schema:
                type: string
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate the refresh token and get a new access token
      security:
        - refreshCookie: []
      parameters:
        - name: X-Requested-With
          in: header
          required: true
          description: Must be `fetch`. Extra CSRF guard.
          schema:
            type: string
            enum: [fetch]
      responses:
        '200':
          description: New access token and a new refresh cookie. The old refresh token is revoked.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current refresh session
      responses:
        '204':
          description: Signed out. The refresh cookie is cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Profile, roles, permissions and zones of the signed-in user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /geo/geocode:
    get:
      tags: [Orders]
      operationId: geocodeAddress
      summary: Resolve an address to a point (needs order.create, dispatch.batch.manage or config.zone.manage)
      description: Uses Nominatim when app.geocoding.enabled is true. 20 requests per minute per user.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 200
      responses:
        '200':
          description: Point found
          content:
            application/json:
              schema:
                type: object
                required: [lat, lng]
                properties:
                  lat:
                    type: number
                  lng:
                    type: number
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: EXTERNAL_DEPENDENCY_UNAVAILABLE when address search is not enabled

  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create an order (UC-01)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          headers:
            Location:
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List orders. Customers only see their own.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: zoneId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Order code
          schema:
            type: string
        - name: windowFrom
          in: query
          description: Only orders whose delivery window ends after this time
          schema:
            type: string
            format: date-time
        - name: windowTo
          in: query
          description: Only orders whose delivery window starts before this time
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Order detail
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Orders]
      operationId: updateOrder
      summary: Replace the editable content of a draft or ready order (UC-02). The zone is resolved again from the pickup point.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: Updated order
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /orders/{orderId}/cancel:
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an order (UC-03). The owner can cancel a draft or ready order; a reason is required once it is ready. Dispatch staff may cancel a ready order in their zone.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Cancelled order
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /orders/{orderId}/tracking:
    get:
      tags: [Orders]
      operationId: getOrderTracking
      summary: Customer-safe timeline of an order (UC-06). Internal reasons and audit details are never included.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Milestones, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderTracking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/submit:
    post:
      tags: [Orders]
      operationId: submitOrder
      summary: Move a draft order to READY_FOR_DISPATCH
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Order is ready for dispatch
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /dispatch/batches:
    get:
      tags: [Dispatch]
      operationId: listBatches
      summary: Batches in the caller's zones, newest first (UC-08)
      parameters:
        - name: from
          in: query
          description: Start of the time range. On the board it narrows only the readyOrders panel (order window overlap). On lists it filters by creation time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End of the time range, must be after from.
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, LOCKED, COMPLETED, CANCELLED]
        - name: zoneId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Text search on codes (and driver name for deliveries)
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of batches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSummaryPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Dispatch]
      operationId: createBatch
      summary: Create a draft delivery batch from ready orders (UC-10)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchRequest'
      responses:
        '201':
          description: Batch created in DRAFT
          headers:
            Location:
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /dispatch/board:
    get:
      tags: [Dispatch]
      operationId: getDispatchBoard
      summary: Dispatch board (UC-08). Eight panels of work that needs action. Poll every 15 seconds with If-None-Match.
      parameters:
        - name: zoneId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Text search on codes (and driver name for deliveries)
          schema:
            type: string
        - name: from
          in: query
          description: Start of the time range. On the board it narrows only the readyOrders panel (order window overlap). On lists it filters by creation time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End of the time range, must be after from.
          schema:
            type: string
            format: date-time
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Panels as of now. The ETag changes only when panel content changes.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchBoard'
        '304':
          description: Nothing changed since the ETag the client sent
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /dispatch/deliveries:
    get:
      tags: [Dispatch]
      operationId: monitorDeliveries
      summary: Active delivery monitor (UC-37). Read-only; ACTIVE (default) means assigned, accepted, awaiting reassignment or in progress.
      parameters:
        - name: from
          in: query
          description: Start of the time range. On the board it narrows only the readyOrders panel (order window overlap). On lists it filters by creation time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End of the time range, must be after from.
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, ASSIGNED, ACCEPTED, AWAITING_REASSIGNMENT, IN_PROGRESS, COMPLETED, CANCELLED]
        - name: zoneId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Text search on codes (and driver name for deliveries)
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of deliveries, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryMonitorPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /dispatch/batches/{batchId}:
    get:
      tags: [Dispatch]
      operationId: getBatch
      summary: Batch detail with totals and capabilities
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Batch
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /dispatch/batches/{batchId}/lock:
    post:
      tags: [Dispatch]
      operationId: lockBatch
      summary: Lock a draft batch (UC-12)
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: Batch is LOCKED
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: BATCH_LOCK_VALIDATION_FAILED. `details` lists invalid orders and capacity violations.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /dispatch/eligible-orders:
    get:
      tags: [Dispatch]
      operationId: listEligibleOrders
      summary: Orders that are ready for dispatch and can join a batch (UC-09)
      description: Needs permission dispatch.batch.manage. Only READY_FOR_DISPATCH orders in the caller's zones are listed.
      parameters:
        - name: zoneId
          in: query
          schema:
            type: string
            format: uuid
        - name: windowFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: windowTo
          in: query
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: One page of eligible orders
          content:
            application/json:
              schema:
                type: object
                required: [items, asOf]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, code, zoneId, weightG, windowStart, windowEnd]
                      properties:
                        id:
                          type: string
                          format: uuid
                        code:
                          type: string
                        zoneId:
                          type: string
                          format: uuid
                        weightG:
                          type: integer
                        volumeCm3:
                          type: integer
                          format: int64
                        windowStart:
                          type: string
                          format: date-time
                        windowEnd:
                          type: string
                          format: date-time
                        pickupAddress:
                          type: string
                        dropoffAddress:
                          type: string
                  nextCursor:
                    type: string
                    nullable: true
                  asOf:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /dispatch/batches/{batchId}/membership:
    post:
      tags: [Dispatch]
      operationId: changeBatchMembership
      summary: Add or remove orders of a draft batch (UC-10, UC-11)
      description: Only a DRAFT batch can change. A batch must keep at least one order. Every change bumps the batch version.
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                addOrderIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                removeOrderIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Updated batch
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /dispatch/batches/{batchId}/reopen:
    post:
      tags: [Dispatch]
      operationId: reopenBatch
      summary: Reopen a locked batch for editing (UC-38)
      description: Needs permission dispatch.batch.manage. Refused with 409 once a driver is assigned. Active recommendations are invalidated.
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelDispatchRequest'
      responses:
        '200':
          description: Updated batch
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /dispatch/batches/{batchId}/cancel:
    post:
      tags: [Dispatch]
      operationId: cancelBatch
      summary: Cancel a draft or locked batch and release its orders
      description: Needs permission dispatch.cancel. Refused with 409 once a driver is assigned. Orders return to READY_FOR_DISPATCH.
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelDispatchRequest'
      responses:
        '200':
          description: Updated batch
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /dispatch/batches/{batchId}/recommendations:
    post:
      tags: [Dispatch]
      operationId: generateRecommendations
      summary: Generate a ranked driver recommendation for a locked batch (UC-13)
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '201':
          description: Snapshot created. `outcome` is RANKED or NO_ELIGIBLE_DRIVER; both are successes.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/Unavailable'

  /dispatch/batches/{batchId}/recommendations/current:
    get:
      tags: [Dispatch]
      operationId: getCurrentRecommendation
      summary: Current snapshot of a batch with its server-computed effective status
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /dispatch/batches/{batchId}/decision:
    get:
      tags: [Dispatch]
      operationId: getBatchDecision
      summary: Current dispatch decision of a batch with its latest assignment
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Decision state; capabilities list the next dispatcher actions
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /dispatch/decisions/{decisionId}/assign:
    post:
      tags: [Dispatch]
      operationId: assignRecommendedDriver
      summary: Assign the top driver of a snapshot (UC-14), or override with another eligible driver (UC-15, needs dispatch.recommendation.override and a reason)
      parameters:
        - name: decisionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequest'
      responses:
        '200':
          description: Assignment created in PENDING; driver reserved; delivery ASSIGNED
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: VERSION_CONFLICT, RECOMMENDATION_EXPIRED, RECOMMENDATION_INVALIDATED, DRIVER_INELIGIBLE or ASSIGNMENT_CONFLICT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /dispatch/decisions/{decisionId}/reassign:
    post:
      tags: [Dispatch]
      operationId: reassignDriver
      summary: Replace the driver of a decision after a rejection or before the delivery starts (UC-16)
      parameters:
        - name: decisionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignRequest'
      responses:
        '200':
          description: New assignment in PENDING; the previous driver is released
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /dispatch/decisions/{decisionId}/cancel:
    post:
      tags: [Dispatch]
      operationId: cancelDispatch
      summary: Cancel a dispatch decision; orders return to BATCHED, driver and vehicle are released (UC-17)
      parameters:
        - name: decisionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelDispatchRequest'
      responses:
        '200':
          description: Decision CANCELLED
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchCancelledEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /assignments/{assignmentId}/reject:
    post:
      tags: [Delivery]
      operationId: rejectAssignment
      summary: Driver rejects an assignment with a catalog reason (UC-20)
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectAssignmentRequest'
      responses:
        '200':
          description: Assignment REJECTED; delivery waits for reassignment
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /catalogs/rejection-reasons:
    get:
      tags: [Delivery]
      operationId: listRejectionReasons
      summary: Active rejection reasons a driver can pick from
      responses:
        '200':
          description: Reasons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectionReasonList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/roles/{roleCode}/permissions:
    put:
      tags: [Admin]
      operationId: changeRolePermissions
      summary: Replace the permissions of a role (needs iam.role.manage)
      description: The system admin role must keep iam.user.manage and iam.role.manage. Every change is audited with before and after.
      parameters:
        - name: roleCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionCodes, reason]
              properties:
                permissionCodes:
                  type: array
                  items:
                    type: string
                reason:
                  type: string
      responses:
        '200':
          description: Role with its new permissions
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/zones/{zoneId}/deactivate:
    post:
      tags: [Admin]
      operationId: deactivateZone
      summary: Stop using a zone so it no longer receives new orders (needs config.zone.manage)
      description: Refused with 409 while the zone still has open orders (READY_FOR_DISPATCH, BATCHED, ASSIGNED, IN_DELIVERY) or open batches (DRAFT, LOCKED). details lists blockingOrders and blockingBatches.
      parameters:
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The zone, now inactive
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/zones/{zoneId}/activate:
    post:
      tags: [Admin]
      operationId: activateZoneState
      summary: Use a stopped zone again (needs config.zone.manage)
      parameters:
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The zone, now active
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /me/deliveries:
    get:
      tags: [Delivery]
      operationId: listMyDeliveries
      summary: Deliveries of the signed-in driver with batch, zone, stop count and open exceptions
      parameters:
        - name: status
          in: query
          description: Repeatable. ASSIGNED, ACCEPTED, AWAITING_REASSIGNMENT, IN_PROGRESS, COMPLETED or CANCELLED.
          schema:
            type: array
            items:
              type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: One page, newest first
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/deliveries/{deliveryId}:
    get:
      tags: [Delivery]
      operationId: getMyDeliveryOverview
      summary: Overview of one delivery of the signed-in driver, with stops, vehicle and assignment state
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Delivery overview
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/assignments:
    get:
      tags: [Delivery]
      operationId: listMyAssignments
      summary: Assignments of the signed-in driver
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /assignments/{assignmentId}/accept:
    post:
      tags: [Delivery]
      operationId: acceptAssignment
      summary: Driver accepts an assignment (UC-19)
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Assignment and delivery are ACCEPTED
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /deliveries/{deliveryId}:
    get:
      tags: [Delivery]
      operationId: getDelivery
      summary: Delivery with stops, progress and capabilities
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
      responses:
        '200':
          description: Delivery
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /deliveries/{deliveryId}/start:
    post:
      tags: [Delivery]
      operationId: startDelivery
      summary: Start an accepted delivery (UC-21). Snapshots the effective POD policy.
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Delivery is IN_PROGRESS
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /deliveries/{deliveryId}/stops/{stopId}/actions:
    post:
      tags: [Delivery]
      operationId: updateStop
      summary: Move a stop through its states (UC-22). There is no COMPLETE action because a stop completes when its POD is valid.
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
        - $ref: '#/components/parameters/StopId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopActionRequest'
      responses:
        '200':
          description: Stop updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /deliveries/{deliveryId}/complete:
    post:
      tags: [Delivery]
      operationId: completeDelivery
      summary: Complete a delivery (UC-24)
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Delivery COMPLETED, orders DELIVERED
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: COMPLETION_PREREQUISITES_MISSING (details list incomplete stops, missing POD and blocking exceptions), VERSION_CONFLICT or STATE_TRANSITION_NOT_ALLOWED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /deliveries/{deliveryId}/evidence-uploads:
    post:
      tags: [Proof]
      operationId: prepareEvidenceUpload
      summary: Ask for a short-lived upload URL for a photo or signature
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceUploadRequest'
      responses:
        '201':
          description: Upload slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceUploadResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /evidence/{evidenceId}/content:
    put:
      tags: [Proof]
      operationId: uploadEvidenceContent
      summary: Upload the image bytes to the slot returned by evidence-uploads. Used by the local storage adapter.
      parameters:
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Stored
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /evidence/{evidenceId}/complete:
    post:
      tags: [Proof]
      operationId: completeEvidenceUpload
      summary: Tell the server the upload finished so it can verify size, type and owner
      parameters:
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceCompleteRequest'
      responses:
        '200':
          description: Evidence status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /deliveries/{deliveryId}/stops/{stopId}/pod:
    post:
      tags: [Proof]
      operationId: submitPod
      summary: Submit proof of delivery for a stop (UC-25). The server sets the timestamp.
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
        - $ref: '#/components/parameters/StopId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitPodRequest'
      responses:
        '201':
          description: POD created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodEnvelope'
        '200':
          description: Same Idempotency-Key replayed; the existing POD is returned
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: POD_POLICY_NOT_SATISFIED (details.missing lists the evidence still needed), EVIDENCE_INVALID or OTP_INVALID_OR_EXPIRED (the challenge is not verified for this stop or was already used)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /pods/{podId}:
    get:
      tags: [Proof]
      operationId: getPod
      summary: View a POD within the caller's scope. OTP is only shown as VERIFIED or NOT_VERIFIED.
      parameters:
        - name: podId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: POD
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /deliveries/{deliveryId}/stops/{stopId}/otp-challenges:
    post:
      tags: [Proof]
      operationId: issueOtp
      summary: Email a one-time code to the recipient (UC-25). The code is never returned.
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
        - $ref: '#/components/parameters/StopId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Challenge issued; any earlier active challenge for the stop is expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpIssued'
        '200':
          description: Same Idempotency-Key replayed; no second email is sent
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpIssued'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

  /otp-challenges/{challengeId}/verify:
    post:
      tags: [Proof]
      operationId: verifyOtp
      summary: Verify the code the recipient reads out. Five wrong tries lock the challenge.
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, status]
                properties:
                  challengeId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [VERIFIED]
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: OTP_INVALID_OR_EXPIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          $ref: '#/components/responses/Locked'

  /orders/{orderId}/pod:
    get:
      tags: [Proof]
      operationId: getOrderPod
      summary: The proof of delivery of an order the caller may see (customer owner, dispatcher in scope, submitting driver)
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: POD
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /pods/{podId}/evidence/{evidenceId}/access:
    post:
      tags: [Proof]
      operationId: grantEvidenceAccess
      summary: Get a 120-second signed link to view one attached evidence file
