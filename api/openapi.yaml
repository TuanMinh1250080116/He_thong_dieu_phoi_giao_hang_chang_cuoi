      properties:
        username:
          type: string
          nullable: true
          description: Optional sign-in name, 3 to 32 of a-z 0-9 . _ - (stored lowercase).
        displayName:
          type: string
        phone:
          type: string
          nullable: true
          description: Replaces the stored phone; null or blank clears it.

    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
