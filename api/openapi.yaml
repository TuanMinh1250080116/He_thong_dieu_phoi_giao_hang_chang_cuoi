        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
          nullable: true
        before:
          type: object
          nullable: true
          additionalProperties: true
        after:
          type: object
          nullable: true
          additionalProperties: true
        reason:
          type: string
          nullable: true
        correlationId:
          type: string

    AuditPage:
